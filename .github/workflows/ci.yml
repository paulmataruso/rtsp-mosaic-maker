name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency license check (AGPL compatibility)
        run: npm run check-licenses

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    name: docker compose up + health
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          printf 'APP_SECRET=ci-smoke-secret\n' > .env
          docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' camera-mosaic-app 2>/dev/null || echo starting)
            echo "attempt $i: $s"
            [ "$s" = healthy ] && exit 0
            sleep 5
          done
          echo "app did not become healthy"; docker compose logs; exit 1
      - name: Basic endpoint checks
        run: |
          curl -fsS http://127.0.0.1:3333/api/health | tee /dev/stderr | grep -q '"status"'
          curl -fsS -o /dev/null http://127.0.0.1:3333/
          curl -fsS -o /dev/null http://127.0.0.1:3333/docs/json
      - name: Tear down
        if: always()
        run: docker compose down -v
