name: camera-mosaic-dev

###############################################################################
# Development stack.
#
#   docker compose -f docker-compose.dev.yml up
#
# Runs ONLY MediaMTX + a couple of synthetic RTSP test cameras in containers.
# Run the app itself on the host with hot-reload:
#
#   npm install
#   npm run dev            # backend :3333, frontend (Vite) :5173
#
# The frontend dev server proxies /api and /ws to the backend, and the backend
# talks to MediaMTX on localhost:9997 (published below for dev only).
#
# Test cameras publish H.264 test patterns to:
#   rtsp://localhost:8554/test-cam-1   (1280x720, 15 fps, moving box + timestamp)
#   rtsp://localhost:8554/test-cam-2   (640x360,  10 fps, SMPTE bars)
# Add them as cameras in the UI to exercise the full pipeline without hardware.
###############################################################################

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    container_name: cm-dev-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8554:8554/udp"
      - "8888:8888"
      - "8889:8889"
      # Dev only: expose the Control API + metrics on the host so `npm run dev`
      # (running outside Docker) can reach them.
      - "9997:9997"
      - "9998:9998"
    volumes:
      - ./mediamtx/mediamtx.dev.yml:/mediamtx.yml:ro

  test-cam-1:
    image: linuxserver/ffmpeg:version-7.1-cli
    container_name: cm-dev-testcam1
    restart: unless-stopped
    depends_on: [mediamtx]
    entrypoint: ["ffmpeg"]
    command: >
      -re -f lavfi -i testsrc=size=1280x720:rate=15
      -f lavfi -i sine=frequency=440:sample_rate=48000
      -vf "drawtext=text='TEST CAM 1 %{localtime}':x=20:y=20:fontsize=32:fontcolor=white:box=1:boxcolor=black@0.5"
      -c:v libx264 -preset veryfast -tune zerolatency -g 30 -pix_fmt yuv420p
      -c:a aac -b:a 96k
      -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/test-cam-1

  test-cam-2:
    image: linuxserver/ffmpeg:version-7.1-cli
    container_name: cm-dev-testcam2
    restart: unless-stopped
    depends_on: [mediamtx]
    entrypoint: ["ffmpeg"]
    command: >
      -re -f lavfi -i smptebars=size=640x360:rate=10
      -vf "drawtext=text='TEST CAM 2':x=20:y=20:fontsize=24:fontcolor=white:box=1:boxcolor=black@0.5"
      -c:v libx264 -preset veryfast -tune zerolatency -g 20 -pix_fmt yuv420p
      -an
      -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/test-cam-2
